name: Build Face15

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip if needed
        run: |
          if [ ! -f Makefile ]; then
            for z in *.zip; do unzip -o "$z"; done
          fi
          if [ -d Face15 ] && [ -f Face15/Makefile ]; then
            cp -R Face15/. .
          fi
          ls -la
          test -f Makefile
          test -f Face15.plist
          # All plists must be readable by the mobile user: the filter
          # plist is read by the loader inside SpringBoard, and the
          # PreferenceLoader entry + prefs Root.plist are read by the
          # Settings app. VoiceChat15 0.1.0 shipped them as 640/750 and
          # the Settings pane never appeared. Normalize the whole tree.
          find . -type d -exec chmod 755 {} +
          find . -type f -exec chmod 644 {} +
          chmod 644 Face15.plist prefs/entry.plist prefs/Resources/Root.plist Face15App/Resources/Info.plist
          ls -l Face15.plist prefs/entry.plist prefs/Resources/Root.plist Face15App/Resources/Info.plist

      - name: Install build tools (ldid, dpkg)
        run: |
          brew install ldid dpkg || brew install ldid dpkg
          which ldid
          which dpkg-deb || true

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks"
          git -C "$THEOS/sdks" sparse-checkout set iPhoneOS16.5.sdk
          ls "$THEOS/sdks"
          xcodebuild -version

      - name: Build package (rootless, arm64)
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 2>&1 | tee build.log
          ls -lh packages/

      - name: Inspect Debian package
        run: |
          set -e
          DEB="$(ls packages/*.deb | head -n 1)"
          echo "DEB=$DEB"
          {
            echo "=== Package file ==="
            echo "$DEB"
            echo
            echo "=== Control metadata (dpkg-deb -f) ==="
            dpkg-deb -f "$DEB"
            echo
            echo "=== Contents (dpkg-deb -c) ==="
            dpkg-deb -c "$DEB"
            echo
            echo "=== Required files check ==="
            dpkg-deb -c "$DEB" | grep -E "Face15\.dylib" || { echo "MISSING: Face15.dylib"; exit 1; }
            dpkg-deb -c "$DEB" | grep -E "Face15\.plist" || { echo "MISSING: Face15.plist"; exit 1; }
            dpkg-deb -c "$DEB" | grep -E "Face15Prefs" || { echo "MISSING: Face15Prefs bundle"; exit 1; }
            dpkg-deb -c "$DEB" | grep -E "Face15App\.app/Face15App" || { echo "MISSING: Face15App binary"; exit 1; }
            echo "dylib, plist, prefs bundle and app are present."
            echo
            echo "=== Filter plist permission check (must be 644) ==="
            dpkg-deb -c "$DEB" | grep -E "DynamicLibraries/Face15\.plist" | grep -q "^-rw-r--r--" \
              && echo "Plist permission OK: 644" || { echo "Plist permission NG: not 644"; exit 1; }
            echo
            echo "=== Prefs visibility permission check (VoiceChat15 0.1.0 incident) ==="
            dpkg-deb -c "$DEB" | grep -E "PreferenceLoader/Preferences/Face15Prefs\.plist" | grep -q "^-rw-r--r--" \
              && echo "Entry plist permission OK: 644" || { echo "Entry plist permission NG: not 644"; exit 1; }
            dpkg-deb -c "$DEB" | grep -E "Face15Prefs\.bundle/Root\.plist" | grep -q "^-rw-r--r--" \
              && echo "Root.plist permission OK: 644" || { echo "Root.plist permission NG: not 644"; exit 1; }
            dpkg-deb -c "$DEB" | grep -E "PreferenceBundles/Face15Prefs\.bundle$" | grep -q "^drwxr-xr-x" \
              && echo "Bundle dir permission OK: 755" || { echo "Bundle dir permission NG: not 755"; exit 1; }
            echo
            echo "=== App Info.plist permission check (must be 644) ==="
            dpkg-deb -c "$DEB" | grep -E "Face15App\.app/Info\.plist" | grep -q "^-rw-r--r--" \
              && echo "App Info.plist permission OK: 644" || { echo "App Info.plist permission NG: not 644"; exit 1; }
            echo
            echo "=== Extract and inspect ==="
            rm -rf pkg_inspect && mkdir -p pkg_inspect
            dpkg-deb -x "$DEB" pkg_inspect
            find pkg_inspect -type f | sort
            echo
            echo "=== Filter plist contents ==="
            PLIST_PATH="$(find pkg_inspect -name 'Face15.plist' -path '*DynamicLibraries*' | head -n 1)"
            echo "Plist path in package: $PLIST_PATH"
            cat "$PLIST_PATH"
            grep -q "com.apple.springboard" "$PLIST_PATH" && echo "Filter target OK: com.apple.springboard"
            echo
            echo "=== Dylib architecture ==="
            DYLIB_PATH="$(find pkg_inspect -name 'Face15.dylib' | head -n 1)"
            echo "Dylib path in package: $DYLIB_PATH"
            file "$DYLIB_PATH"
            (lipo -info "$DYLIB_PATH" || true)
            echo
            echo "=== Dylib linked libraries (otool -L) ==="
            (otool -L "$DYLIB_PATH" || true)
            echo
            echo "=== Prefs bundle architecture ==="
            PREFS_PATH="$(find pkg_inspect -name 'Face15Prefs' -type f -path '*bundle*' | head -n 1)"
            echo "Prefs binary path: $PREFS_PATH"
            file "$PREFS_PATH"
            (lipo -info "$PREFS_PATH" || true)
            echo
            echo "=== App architecture ==="
            APP_PATH="$(find pkg_inspect -name 'Face15App' -type f -path '*.app*' | head -n 1)"
            echo "App binary path: $APP_PATH"
            file "$APP_PATH"
            (lipo -info "$APP_PATH" || true)
            echo
            echo "=== Rootless path check ==="
            find pkg_inspect -type f | grep -q "var/jb/Library/MobileSubstrate/DynamicLibraries/Face15.dylib" \
              && echo "Rootless dylib path OK" || { echo "Rootless dylib path NG"; exit 1; }
            find pkg_inspect -type f | grep -q "var/jb/Library/MobileSubstrate/DynamicLibraries/Face15.plist" \
              && echo "Rootless plist path OK" || { echo "Rootless plist path NG"; exit 1; }
            find pkg_inspect -type f | grep -q "var/jb/Applications/Face15App.app/Face15App" \
              && echo "Rootless app path OK" || { echo "Rootless app path NG"; exit 1; }
          } 2>&1 | tee inspection_report.txt
          cp "$DEB" Face15_Dopamine_Rootless.deb

      - name: Prepare source ZIP
        run: |
          rm -rf source_zip && mkdir -p source_zip/Face15
          cp -R Makefile control Tweak.x Face15Manager.h Face15Manager.m Face15.plist README_JP.md prefs Face15App .github source_zip/Face15/
          (cd source_zip && zip -r ../Face15_Source.zip Face15)
          ls -lh Face15_Source.zip Face15_Dopamine_Rootless.deb build.log inspection_report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FACE15-0.1.0-rootless
          path: |
            Face15_Dopamine_Rootless.deb
            Face15_Source.zip
            build.log
            inspection_report.txt
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: face15-build-log-failure
          path: |
            build.log
            inspection_report.txt
          if-no-files-found: ignore
